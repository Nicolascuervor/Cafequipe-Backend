<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #FFFFFF; font-family: 'Segoe UI', Helvetica, Arial, sans-serif;">

    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #FFFFFF; table-layout: fixed;">
        <tr>
            <td align="center" style="padding: 60px 20px;">
                
                <table width="100%" max-width="520" border="0" cellspacing="0" cellpadding="0" style="max-width: 520px; background-color: #F7F3EE; border-radius: 24px; overflow: hidden;">
                    
                    <tr>
                        <td align="center" style="padding: 55px 50px 30px 50px;">
                            <span style="color: #2C231E; font-size: 16px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;">Syncra</span>
                            <div style="color: #A8998E; font-size: 10px; margin-top: 6px; letter-spacing: 2px; font-weight: 600;">CAFEQUIPE WMS</div>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 0px 50px 50px 50px; text-align: center;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    
                    <tr>
                        <td style="padding: 30px 50px; background-color: #F1EAE2; text-align: center;">
                            <p style="color: #9C8D82; font-size: 11px; margin: 0; line-height: 1.6; letter-spacing: 0.3px;">
                                Este es un correo automático de seguridad generado por Syncra.<br>Por cuestiones de privacidad, por favor no respondas a este mensaje.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
