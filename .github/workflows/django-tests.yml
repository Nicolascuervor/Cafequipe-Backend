name: Django Tests CI

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "develop", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Configuramos un contenedor de PostgreSQL para las pruebas
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cafequipe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Aseguramos que la BD esté lista antes de correr los tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Entorno virtual de variables que necesita Django-Environ
    env:
      SECRET_KEY: 'test-secret-key-github-actions'
      DEBUG: 'True'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/cafequipe_test'
      CORS_ALLOW_ALL: 'True'

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # Acelera la instalación guardando las dependencias en caché

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar migraciones (Sanity check)
      run: |
        python manage.py makemigrations --check --dry-run
        
    - name: Ejecutar batería de Pruebas (Pytest)
      run: |
        pytest || [ $? -eq 5 ]
